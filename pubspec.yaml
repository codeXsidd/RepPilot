name: rep_pilot
description: "A free, offline-first Android fitness app."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  fl_chart: ^0.70.2
  file_picker: ^13.0.0
  flutter_svg: ^2.0.17
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/muscle_groups/
    - assets/images/equipment/
