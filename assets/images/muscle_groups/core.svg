  <path d="M138,72 L140,115 L135,155 L128,160 L118,160 L118,72 Z" fill="#4CAF50" stroke="#333" stroke-width="1.5" opacity="0.7"/>
  <!-- Ab separation lines -->
  <line x1="100" y1="74" x2="100" y2="162" stroke="#333" stroke-width="1.5" opacity="0.5"/>
  <line x1="84" y1="85" x2="116" y2="85" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="84" y1="100" x2="116" y2="100" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="84" y1="115" x2="116" y2="115" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="85" y1="130" x2="115" y2="130" stroke="#333" stroke-width="1" opacity="0.5"/>
  <line x1="86" y1="145" x2="114" y2="145" stroke="#333" stroke-width="1" opacity="0.5"/>
  <!-- Waist -->
  <path d="M62,160 L82,166 L100,168 L118,166 L138,160 L140,170 L100,175 L60,170 Z" fill="#E0E0E0" stroke="#333" stroke-width="1.5"/>
