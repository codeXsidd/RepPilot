  <!-- Chest lines -->
  <line x1="100" y1="70" x2="100" y2="148" stroke="#333" stroke-width="1" opacity="0.3"/>
  <!-- Waist -->
  <rect x="70" y="150" width="60" height="10" rx="3" fill="#E0E0E0" stroke="#333" stroke-width="1.5"/>
  <!-- Left Leg -->
  <path d="M75,160 L70,195 L85,195 L90,160" fill="#E0E0E0" stroke="#333" stroke-width="2"/>
  <!-- Right Leg -->
  <path d="M110,160 L115,195 L130,195 L125,160" fill="#E0E0E0" stroke="#333" stroke-width="2"/>
</svg>