  <!-- Weight stack -->
  <rect x="34" y="10" width="5" height="3" rx="0.5" fill="#4CAF50"/>
  <rect x="34" y="14" width="5" height="3" rx="0.5" fill="#4CAF50"/>
  <rect x="34" y="18" width="5" height="3" rx="0.5" fill="#4CAF50"/>
