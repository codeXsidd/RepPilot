<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Pulley frame top -->
  <rect x="18" y="2" width="12" height="3" rx="1" fill="#4CAF50"/>
  <!-- Pulley wheel -->
  <circle cx="24" cy="10" r="5" fill="none" stroke="#4CAF50" stroke-width="2.5"/>
  <circle cx="24" cy="10" r="1.5" fill="#4CAF50"/>
  <!-- Cable line -->
  <line x1="24" y1="15" x2="24" y2="36" stroke="#4CAF50" stroke-width="2" stroke-dasharray="2,2"/>
  <!-- Handle grip -->
  <rect x="18" y="36" width="12" height="3" rx="1.5" fill="#4CAF50"/>
  <!-- Handle bar -->
  <rect x="16" y="39" width="16" height="4" rx="1" fill="#4CAF50"/>
  <!-- Weight stack (left side) -->
  <rect x="6" y="8" width="8" height="3" rx="0.5" fill="#4CAF50"/>
  <rect x="6" y="12" width="8" height="3" rx="0.5" fill="#4CAF50"/>
  <rect x="6" y="16" width="8" height="3" rx="0.5" fill="#4CAF50"/>
  <rect x="6" y="20" width="8" height="3" rx="0.5" fill="#4CAF50" opacity="0.6"/>
  <rect x="6" y="24" width="8" height="3" rx="0.5" fill="#4CAF50" opacity="0.4"/>
</svg>